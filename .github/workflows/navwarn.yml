name: NAVAREA warnings
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/navwarn.mjs, .github/workflows/navwarn.yml]
permissions: { contents: write }
concurrency: { group: navwarn, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/navwarn.mjs
      - run: |
          git config user.name "navwarn-bot"; git config user.email "actions@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch navwarn.json; git add -A navwarn
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -qm "NAVAREA warnings $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
