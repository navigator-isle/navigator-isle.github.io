name: wpi probe
on:
  push:
    branches: [claude/wpi-probe]
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          set +e; mkdir -p probe; cd probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for u in "https://msi.nga.mil/api/publications/download?type=view&key=16920959/SFH00000/UpdatedPub150.csv" "https://msi.nga.mil/api/publications/download?key=16920959/SFH00000/UpdatedPub150.csv&type=download" "https://msi.nga.mil/api/publications/world-port-index?output=csv"; do
            n=$((n+1)); curl -sSL -m 120 -A "$UA" -o wpi$n.bin -w "$n %{http_code} %{size_download} %{content_type}\n" "$u" | tee -a status.txt
          done
          for f in wpi*.bin; do head -c 300 $f; echo; done
          ls -la
      - run: |
          cd probe; for f in wpi*.bin; do s=$(stat -c%s $f); if [ $s -lt 1000000 ] && ! grep -q "World Port Index Number" $f; then rm $f; fi; done; true
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add probe && git commit -qm probe && git push -q -f origin HEAD:wpi-probe-data
