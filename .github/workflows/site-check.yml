name: Site check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a test browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Passage Planner still works
        env:
          PW_DIR: ${{ runner.temp }}/pw
        run: node tests/site-check.mjs
